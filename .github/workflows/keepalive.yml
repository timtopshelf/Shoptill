# Keeps the free Supabase project from being paused for inactivity.
# Needs two repository secrets: SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY (Settings > Secrets and variables > Actions).
name: keepalive
on:
  schedule: [{cron: '0 6 */3 * *'}]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/ping" -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" -H "Content-Type: application/json" -d '{}'
